<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Moderation — Meera's Veda</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #f4ecdc;
    --paper: #faf5e8;
    --ink: #2a221a;
    --ink-soft: #4a4138;
    --muted: #9a8e7a;
    --line: #d9cfb8;
    --gold: #b89968;
    --gold-deep: #8a6f3e;
    --dark: #1e170f;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }

  /* ── Passphrase gate ── */
  #gate {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 48px 36px;
    width: 100%; max-width: 380px;
    text-align: center;
  }
  #gate h1 { font-size: 22px; font-weight: normal; font-style: italic; color: var(--ink); margin-bottom: 6px; }
  #gate p { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
  #gate input {
    width: 100%; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 4px;
    background: #fff; font-size: 15px; color: var(--ink);
    text-align: center; letter-spacing: 0.05em;
  }
  #gate input:focus { outline: none; border-color: var(--gold); }
  #gate button {
    width: 100%; margin-top: 14px; padding: 12px;
    background: var(--dark); color: var(--paper);
    border: none; border-radius: 4px; font-size: 14px;
    cursor: pointer; letter-spacing: 0.05em;
  }
  #gate button:hover { background: var(--gold-deep); }
  #gateError { color: #b0433a; font-size: 13px; margin-top: 12px; display: none; }

  /* ── Admin panel ── */
  #panel { display: none; width: 100%; max-width: 820px; }
  .header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 24px; }
  .header h1 { font-size: 26px; font-style: italic; font-weight: normal; }
  .header .sub { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }

  .tabs { display:flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab {
    padding: 8px 18px; border-radius: 20px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink-soft); font-size: 13px;
    cursor: pointer; letter-spacing: 0.03em;
  }
  .tab.active { background: var(--dark); color: var(--paper); border-color: var(--dark); }
  .tab .badge {
    display:inline-block; margin-left:6px; padding: 1px 7px; border-radius: 10px;
    background: var(--gold); color: #fff; font-size: 11px;
  }

  .stats-total {
    background: var(--dark);
    color: var(--paper);
    border-radius: 8px;
    padding: 24px 26px;
    margin-bottom: 20px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .stats-total-number { font-size: 40px; font-style: italic; font-family: Georgia, serif; }
  .stats-total-label { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(245,234,216,0.6); }
  .stats-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px 18px;
    margin-bottom: 8px;
    gap: 12px;
  }
  .stats-rank {
    font-family: Georgia, serif; font-style: italic; color: var(--gold-deep);
    font-size: 15px; width: 22px; flex-shrink: 0;
  }
  .stats-info { flex: 1; min-width: 0; }
  .stats-title { font-size: 15px; color: var(--ink); }
  .stats-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .stats-count {
    font-size: 20px; font-weight: bold; color: var(--ink);
    flex-shrink: 0; text-align: right; min-width: 50px;
  }
  .stats-bar-track {
    height: 3px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden;
  }
  .stats-bar-fill { height: 100%; background: var(--gold); }

  .comment-card {
    background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
    padding: 20px 22px; margin-bottom: 14px;
  }
  .comment-text { font-size: 16px; line-height: 1.6; color: var(--ink); margin-bottom: 12px; white-space: pre-wrap; }
  .comment-meta { display:flex; justify-content:space-between; align-items:center; }
  .comment-name { font-size: 13px; color: var(--gold-deep); font-style: italic; }
  .comment-date { font-size: 12px; color: var(--muted); }
  .comment-actions { display:flex; gap: 8px; margin-top: 14px; }
  .comment-actions button {
    padding: 7px 16px; border-radius: 4px; border: 1px solid var(--line);
    font-size: 13px; cursor: pointer; background: #fff;
  }
  .btn-approve { background: #4a7a5a !important; color: #fff !important; border-color: #4a7a5a !important; }
  .btn-delete { color: #b0433a; }
  .empty { text-align:center; color: var(--muted); font-style: italic; padding: 40px 0; }
  .loading { text-align:center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>

  <div id="gate">
    <h1>Meera's Veda</h1>
    <p>Enter the passphrase to moderate reflections</p>
    <input type="password" id="passInput" placeholder="Passphrase" autocomplete="off">
    <button onclick="tryLogin()">Enter</button>
    <div id="gateError">That's not quite it. Try again.</div>
  </div>

  <div id="panel">
    <div class="header">
      <div>
        <h1>Reflections</h1>
        <div class="sub">Moderation panel</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tabPending" onclick="switchTab('pending')">
        Pending <span class="badge" id="countPending">0</span>
      </button>
      <button class="tab" id="tabApproved" onclick="switchTab('approved')">
        Approved <span class="badge" id="countApproved">0</span>
      </button>
      <button class="tab" id="tabStats" onclick="switchTab('stats')">
        Stats
      </button>
    </div>

    <div id="list"></div>
  </div>

<script>
  // ⚠️ Change this to something only you and Meera know
  const PASSPHRASE = 'meerasveda2026';

  const SUPABASE_URL = 'https://smulanemunnzixygxqda.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtdWxhbmVtdW5ueml4eWd4cWRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4ODE5NDQsImV4cCI6MjA5OTQ1Nzk0NH0.hHPI1m3KVIe6PZlky7-5_8VUsq4UvDOqBj0HiPrPPck';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentTab = 'pending';
  let allComments = [];
  let allViews = [];

  function tryLogin() {
    const val = document.getElementById('passInput').value;
    if (val === PASSPHRASE) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('panel').style.display = 'block';
      sessionStorage.setItem('mv_admin_ok', '1');
      loadAll();
    } else {
      document.getElementById('gateError').style.display = 'block';
    }
  }

  document.getElementById('passInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryLogin();
  });

  // Stay logged in for this browser tab session
  if (sessionStorage.getItem('mv_admin_ok') === '1') {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    loadAll();
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  async function loadAll() {
    document.getElementById('list').innerHTML = '<div class="loading">Loading...</div>';
    try {
      const [{ data: comments, error: cErr }, { data: views, error: vErr }] = await Promise.all([
        sb.from('comments').select('*').order('created_at', { ascending: false }),
        sb.from('page_views').select('*').order('views', { ascending: false })
      ]);
      if (cErr) throw cErr;
      allComments = comments || [];
      allViews = vErr ? [] : (views || []);
    } catch (e) {
      document.getElementById('list').innerHTML = '<div class="empty">Could not load data. Check your connection.</div>';
      return;
    }
    render();
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabPending').classList.toggle('active', tab === 'pending');
    document.getElementById('tabApproved').classList.toggle('active', tab === 'approved');
    document.getElementById('tabStats').classList.toggle('active', tab === 'stats');
    render();
  }

  function timeAgo(dateStr) {
    const diff = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 60) return mins <= 1 ? 'just now' : mins + ' min ago';
    const hours = Math.floor(mins / 60);
    if (hours < 24) return hours + 'h ago';
    const days = Math.floor(hours / 24);
    if (days < 30) return days + 'd ago';
    return new Date(dateStr).toLocaleDateString(undefined, { month: 'short', year: 'numeric' });
  }

  function render() {
    if (currentTab === 'stats') {
      renderStats();
      return;
    }

    const pending = allComments.filter(c => !c.approved);
    const approved = allComments.filter(c => c.approved);
    document.getElementById('countPending').textContent = pending.length;
    document.getElementById('countApproved').textContent = approved.length;

    const list = document.getElementById('list');
    const items = currentTab === 'pending' ? pending : approved;

    if (items.length === 0) {
      list.innerHTML = '<div class="empty">Nothing here yet.</div>';
      return;
    }

    list.innerHTML = items.map(c => {
      const date = new Date(c.created_at).toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
      const actions = currentTab === 'pending'
        ? `<button class="btn-approve" onclick="approveComment(${c.id})">Approve</button>
           <button class="btn-delete" onclick="deleteComment(${c.id})">Delete</button>`
        : `<button class="btn-delete" onclick="deleteComment(${c.id})">Remove</button>`;
      return `<div class="comment-card">
        <div class="comment-text">${escapeHtml(c.text)}</div>
        <div class="comment-meta">
          <span class="comment-name">${escapeHtml(c.name || 'Anonymous')}</span>
          <span class="comment-date">${date}</span>
        </div>
        <div class="comment-actions">${actions}</div>
      </div>`;
    }).join('');
  }

  function renderStats() {
    const list = document.getElementById('list');
    const siteRow = allViews.find(v => v.slug === '__site__');
    const totalVisits = siteRow ? siteRow.views : 0;
    const posts = allViews.filter(v => v.slug !== '__site__').sort((a, b) => b.views - a.views);

    if (allViews.length === 0) {
      list.innerHTML = '<div class="stats-total"><div><div class="stats-total-label">Total Site Visits</div><div class="stats-total-number">0</div></div></div>'
        + '<div class="empty">No views recorded yet. They\'ll start appearing as people read.</div>';
      return;
    }

    const maxViews = posts.length ? posts[0].views : 1;

    const rows = posts.map((p, i) => {
      const pct = Math.round((p.views / maxViews) * 100);
      return `<div class="stats-row">
        <div class="stats-rank">${i + 1}</div>
        <div class="stats-info">
          <div class="stats-title">${escapeHtml(p.title || p.slug)}</div>
          <div class="stats-meta">Last read ${timeAgo(p.last_viewed)}</div>
          <div class="stats-bar-track"><div class="stats-bar-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="stats-count">${p.views}</div>
      </div>`;
    }).join('');

    list.innerHTML = `<div class="stats-total">
        <div>
          <div class="stats-total-label">Total Site Visits</div>
          <div class="stats-total-number">${totalVisits}</div>
        </div>
      </div>` + (rows || '<div class="empty">No individual posts read yet.</div>');
  }

  async function approveComment(id) {
    try {
      const { error } = await sb.from('comments').update({ approved: true }).eq('id', id);
      if (error) throw error;
      await loadAll();
    } catch (e) {
      alert('Could not approve. Try again.');
    }
  }

  async function deleteComment(id) {
    if (!confirm('Delete this reflection permanently?')) return;
    try {
      const { error } = await sb.from('comments').delete().eq('id', id);
      if (error) throw error;
      await loadAll();
    } catch (e) {
      alert('Could not delete. Try again.');
    }
  }
</script>
</body>
</html>
